<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSCAR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <video id="video-feed" autoplay playsinline muted></video>
    <div id="three-container"></div>

    <!-- HUD layer — all 2D interface elements -->
    <div id="hud">
      <!-- Detection labels injected here by labelRenderer.js -->
      <div id="labels"></div>

      <!-- Top bar: system info -->
      <div id="hud-top">
        <span id="app-name">OSCAR</span>
        <span id="detection-count">0 détections</span>
      </div>

      <!-- AR entry button — shown only when WebXR is available -->
      <button id="enter-ar" style="display:none;">Entrer en AR</button>

      <!-- Bottom bar: status -->
      <div id="hud-bottom">
        <span id="status-dot"></span>
        <span id="status">Initialisation...</span>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
