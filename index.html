<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OSCAR - RetailBot AR</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!--
    The canvas where Three.js renders everything (video + 3D overlays).
    Three.js will create its own canvas, so we just need a container.
  -->
  <div id="app">
    <!-- Video element: captures webcam (later: Quest passthrough) -->
    <video id="video-feed" autoplay playsinline></video>

    <!-- Three.js will render its 3D canvas on top of the video -->
    <div id="three-container"></div>

    <!-- Simple HUD overlay for status messages -->
    <div id="hud">
      <div id="status">Initialisation...</div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
