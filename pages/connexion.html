<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Connexion OSCAR" />
  <title>OSCAR VR — Connexion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="../css/oscar.css" />
</head>
<body>
  <canvas id="three-canvas"></canvas>
  <div id="vr-app">
    <div class="screen active">
      <div class="panel" style="width: min(460px, 92vw);">
        <div class="oscar-logo">
          <div class="oscar-logo-ring"></div>
          <span class="oscar-logo-text">OSCAR</span>
        </div>
        <p class="oscar-tagline">Assistant visuel intelligent</p>

        <form id="login-form">
          <div class="form-group">
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
                <circle cx="12" cy="7" r="4"/>
              </svg>
              <input id="input-email" class="form-input" type="email" placeholder="operateur@carrefour.fr" autocomplete="email" required />
            </div>
          </div>

          <div class="form-group">
            <div class="input-wrap">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
              <input id="input-pass" class="form-input" type="password" placeholder="••••••••" autocomplete="current-password" required />
            </div>
          </div>

          <div class="form-footer">
            <label class="checkbox-label">
              <input id="remember-me" type="checkbox" checked />
              <div class="checkbox-box">
                <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="white" stroke-width="2.5">
                  <polyline points="1.5,6 4.5,9 10.5,3"/>
                </svg>
              </div>
              Se souvenir de moi
            </label>
            <a href="#" class="link">Mot de passe oublié ?</a>
          </div>

          <button id="btn-login" class="btn btn-primary" type="submit">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
              <polyline points="10 17 15 12 10 7"/>
              <line x1="15" y1="12" x2="3" y2="12"/>
            </svg>
            Se connecter
          </button>
        </form>

        <div style="display:flex; justify-content:center; margin-top:28px; opacity:0.4; gap:12px; align-items:center;">
          <span style="font-size:13px; color:var(--text-muted);">© 2026 OSCAR – Tous droits réservés</span>
        </div>
      </div>
    </div>
  </div>

  <script src="../js/three-webrtc.js"></script>
  <script src="../js/session.js"></script>
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      new OSCARBackground('three-canvas');

      const form = document.getElementById('login-form');
      const btn = document.getElementById('btn-login');
      const emailInput = document.getElementById('input-email');
      const passInput = document.getElementById('input-pass');
      const rememberCheckbox = document.getElementById('remember-me');

      const storedEmail = localStorage.getItem('oscar-remembered-email') || '';
      const storedPass = localStorage.getItem('oscar-remembered-pass') || '';
      if (storedEmail && storedPass) {
        emailInput.value = storedEmail;
        passInput.value = storedPass;
        rememberCheckbox.checked = true;
      }

      form.addEventListener('submit', (event) => {
        event.preventDefault();
        const email = emailInput.value.trim();
        const pass = passInput.value.trim();
        const remember = rememberCheckbox.checked;

        const isDemoAccount = (email === 'operateur@carrefour.fr' && pass === 'oscar2026') || (email && pass.length >= 4);

        if (!email || !pass || !isDemoAccount) {
          const target = !email || !pass ? document.getElementById('input-email') : document.getElementById('input-pass');
          target?.focus();
          return;
        }

        btn.disabled = true;
        btn.innerHTML = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>Connexion...';
        setTimeout(() => {
          if (remember) {
            localStorage.setItem('oscar-remembered-email', email);
            localStorage.setItem('oscar-remembered-pass', pass);
          } else {
            localStorage.removeItem('oscar-remembered-email');
            localStorage.removeItem('oscar-remembered-pass');
          }
          window.OSCARSession?.setAuthenticated(email);
          window.location.href = 'selection.html';
        }, 800);
      });
    });
  </script>
</body>
</html>
