<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Vue immersive OSCAR" />
  <title>OSCAR VR — Immersif</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="../css/oscar.css" />
</head>
<body data-protect="true">
  <canvas id="three-canvas"></canvas>
  <div id="vr-app" class="screen active" style="padding:0;">
    <canvas id="immersive-canvas" style="width:100%;height:100%;display:block;"></canvas>

    <div class="vr-hud">
      <div class="vr-topbar">
        <div class="vr-live-badge">
          <div class="vr-live-dot"></div>
          LIVE
        </div>
        <div class="vr-time">00:00:00</div>
        <div class="vr-title">Vue immersive du magasin</div>
        <div class="vr-sys">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M5 12.55a11 11 0 0 1 14.08 0"/>
            <path d="M1.42 9a16 16 0 0 1 21.16 0"/>
            <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
            <line x1="12" y1="20" x2="12.01" y2="20"/>
          </svg>
          HD
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="2" y="7" width="20" height="11" rx="2" ry="2"/>
            <path d="M22 11V7"/>
          </svg>
        </div>
      </div>

      <div class="vr-compass">
        <span>NW</span>
        <span class="compass-n">N</span>
        <span>NE</span>
      </div>

      <div class="vr-sidebar">
        <button class="sidebar-btn active" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="3" y1="12" x2="21" y2="12"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <line x1="3" y1="18" x2="21" y2="18"/>
          </svg>
          Menu
        </button>
        <button class="sidebar-btn" data-target="carte" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/>
          </svg>
          Carte
        </button>
        <button class="sidebar-btn" data-target="alertes" type="button" style="position:relative;">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          <div class="sidebar-badge">3</div>
          Alertes
        </button>
        <button class="sidebar-btn" data-target="historique" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <polyline points="12 8 12 12 14 14"/>
            <path d="M3.05 11a9 9 0 1 0 .5-4.4"/>
          </svg>
          Historique
        </button>
        <button class="sidebar-btn" data-target="quitter" type="button" style="color:var(--accent-red);">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
          </svg>
          Quitter
        </button>
      </div>

      <div class="annotation annot-yellow" data-annot-id="ann-1" style="left:9%;top:38%;">
        <span class="annotation-title">Mauvais placement</span>
        <span class="annotation-sub">Produit mal positionné</span>
      </div>

      <div class="annotation annot-red" data-annot-id="ann-2" style="left:24%;top:44%;">
        <span class="annotation-title">Rupture de stock</span>
        <span class="annotation-sub">Coca-Cola 1.5L — Stock: 0</span>
      </div>

      <div class="annotation annot-green" data-annot-id="ann-3" style="left:44%;top:37%;">
        <span class="annotation-title">Stock OK</span>
        <span class="annotation-sub">Sprite 1.5L — Stock: 24</span>
      </div>

      <div class="annotation annot-yellow" data-annot-id="ann-4" style="left:59%;top:44%;">
        <span class="annotation-title">Zone encombrée</span>
        <span class="annotation-sub">Allée partiellement bloquée</span>
      </div>

      <div class="annotation annot-blue" data-annot-id="ann-5" style="left:74%;top:34%;">
        <span class="annotation-title">Client</span>
        <span class="annotation-sub">Distance: 5m</span>
      </div>

      <div class="vr-bottombar">
        <button id="btn-recenter" class="bottom-action" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M21 3L3 21"/>
            <path d="M21 21H15M21 21V15M3 3H9M3 3V9"/>
          </svg>
          Recentrer vue
        </button>
        <button id="btn-zoom-out" class="bottom-action" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <circle cx="11" cy="11" r="8"/>
            <line x1="21" y1="21" x2="16.65" y2="16.65"/>
            <line x1="8" y1="11" x2="14" y2="11"/>
            <line x1="11" y1="8" x2="11" y2="14"/>
          </svg>
          <span>Zoom</span>
        </button>
        <button id="btn-night" class="bottom-action" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="18" height="18">
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
          </svg>
          Mode nuit
        </button>
      </div>
    </div>
  </div>

  <script src="../js/three-webrtc.js"></script>
  <script src="../js/session.js"></script>
  <script>
    function showToast(message) {
      const existing = document.querySelector('.oscar-toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'oscar-toast';
      toast.textContent = message;
      toast.style.cssText = `position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(8,18,35,0.95); border: 1px solid rgba(30,143,255,0.4); color: #E8F0FF; padding: 14px 28px; border-radius: 100px; font-family: 'Exo 2', sans-serif; font-size: 16px; font-weight: 600; z-index: 9999; white-space: nowrap; box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 20px rgba(30,143,255,0.2);`;
      document.body.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      new OSCARBackground('three-canvas');
      const vr = new OSCARVR360('immersive-canvas');

      const updateClock = () => {
        const now = new Date();
        const hh = String(now.getHours()).padStart(2, '0');
        const mm = String(now.getMinutes()).padStart(2, '0');
        const ss = String(now.getSeconds()).padStart(2, '0');
        document.querySelectorAll('.vr-time').forEach((el) => {
          el.textContent = `${hh}:${mm}:${ss}`;
        });
      };
      updateClock();
      setInterval(updateClock, 1000);

      let zoomLevel = 1;
      let nightMode = false;

      document.getElementById('btn-recenter').addEventListener('click', () => {
        vr.sphereYaw = 0;
        vr.spherePitch = 0;
        showToast('Vue recentrée');
      });

      document.getElementById('btn-zoom-out').addEventListener('click', () => {
        zoomLevel = zoomLevel === 1 ? 1.5 : 1;
        vr.camera.fov = zoomLevel === 1 ? 90 : 50;
        vr.camera.updateProjectionMatrix();
        const btn = document.getElementById('btn-zoom-out');
        btn.classList.toggle('active', zoomLevel > 1);
        btn.querySelector('span').textContent = zoomLevel > 1 ? 'Zoom ×1.5' : 'Zoom';
      });

      document.getElementById('btn-night').addEventListener('click', () => {
        nightMode = !nightMode;
        document.body.style.filter = nightMode ? 'sepia(0.4) hue-rotate(180deg) brightness(0.7)' : '';
        document.getElementById('btn-night').classList.toggle('active', nightMode);
        showToast(nightMode ? '🌙 Mode nuit activé' : '☀️ Mode normal');
      });

      document.querySelectorAll('.sidebar-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          if (btn.dataset.target === 'quitter') {
            window.location.href = 'selection.html';
            return;
          }
          if (btn.dataset.target === 'alertes') {
            window.location.href = 'anomalie.html';
            return;
          }
          if (btn.dataset.target === 'carte') {
            showToast('Carte du magasin — fonctionnalité bientôt disponible');
          }
          if (btn.dataset.target === 'historique') {
            showToast('Historique — fonctionnalité bientôt disponible');
          }
        });
      });

      document.querySelectorAll('.annotation').forEach((ann) => {
        ann.addEventListener('click', () => {
          localStorage.setItem('oscar-anomaly-id', ann.dataset.annotId);
          window.location.href = 'anomalie.html';
        });
      });
    });
  </script>
</body>
</html>
