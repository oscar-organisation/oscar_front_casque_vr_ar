<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="Détail de l'anomalie OSCAR" />
  <title>OSCAR VR — Anomalie</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <link rel="stylesheet" href="../css/oscar.css" />
</head>
<body data-protect="true">
  <canvas id="three-canvas"></canvas>
  <div id="vr-app">
    <div class="screen active">
      <div class="panel" style="width: min(500px, 92vw); max-height: 90vh; overflow-y: auto;">
        <div style="display:flex; justify-content:space-between; gap:12px; margin-bottom:24px;">
          <a href="immersive.html" class="btn btn-secondary btn-sm" style="width:auto;">Retour immersive</a>
          <a href="connexion.html" class="btn btn-outline btn-sm" style="width:auto;">Accueil</a>
        </div>

        <div class="anomaly-header">
          <button class="back-btn" id="btn-back" type="button">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <polyline points="15 18 9 12 15 6"/>
            </svg>
            Retour
          </button>
          <div class="anomaly-tag rupture">Rupture de stock</div>
        </div>

        <div class="product-card">
          <div class="product-img">
            <svg viewBox="0 0 60 120" width="60" height="120">
              <rect x="18" y="8" width="24" height="4" rx="2" fill="#e63946"/>
              <rect x="15" y="12" width="30" height="96" rx="8" fill="#c1121f"/>
              <rect x="15" y="12" width="30" height="20" rx="4" fill="#e63946"/>
              <text x="30" y="60" text-anchor="middle" fill="white" font-family="serif" font-weight="bold" font-size="9">Coca</text>
              <text x="30" y="72" text-anchor="middle" fill="white" font-family="serif" font-weight="bold" font-size="9">Cola</text>
              <rect x="18" y="78" width="24" height="2" fill="rgba(255,255,255,0.2)" rx="1"/>
              <rect x="15" y="98" width="30" height="10" rx="4" fill="#9d0208"/>
            </svg>
          </div>
          <div class="product-details">
            <div id="anomaly-product-name" class="product-name">Coca-Cola 1.5L</div>
            <div class="product-location">Rayon Boissons – Allée 2 – Étagère 3</div>
            <div class="product-stat">
              <div class="product-stat-label">Stock estimé</div>
              <div class="product-stat-value zero">0 <span style="font-size:var(--font-base); opacity:0.6;">unité</span></div>
            </div>
          </div>
        </div>

        <div class="status-row">
          <div class="status-item">
            <div class="status-label">Statut</div>
            <div class="status-value critical">Critique</div>
          </div>
          <div class="status-item">
            <div class="status-label">Détecté le</div>
            <div class="detected-time" style="font-size:var(--font-base); color:var(--text-secondary); font-weight:600;">05/05/2024 – 10:24</div>
          </div>
        </div>

        <div style="height:1px; background:var(--border-subtle); margin:4px 0 20px;"></div>

        <div class="actions-title">Actions rapides</div>

        <button class="action-btn green" id="btn-traiter" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-green)" stroke-width="2.5">
            <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/>
            <polyline points="22 4 12 14.01 9 11.01"/>
          </svg>
          Marquer comme traité
        </button>

        <button class="action-btn" id="btn-notifier" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--accent-blue)" stroke-width="2.5">
            <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/>
            <path d="M13.73 21a2 2 0 0 1-3.46 0"/>
          </svg>
          Notifier un employé
        </button>

        <button class="action-btn" id="btn-historique" type="button">
          <svg viewBox="0 0 24 24" fill="none" stroke="var(--text-secondary)" stroke-width="2.5">
            <polyline points="12 8 12 12 14 14"/>
            <path d="M3.05 11a9 9 0 1 0 .5-4.4"/>
          </svg>
          Voir historique
        </button>
      </div>
    </div>
  </div>

  <script src="../js/three-webrtc.js"></script>
  <script src="../js/session.js"></script>
  <script>
    function showToast(message) {
      const existing = document.querySelector('.oscar-toast');
      if (existing) existing.remove();
      const toast = document.createElement('div');
      toast.className = 'oscar-toast';
      toast.textContent = message;
      toast.style.cssText = `position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: rgba(8,18,35,0.95); border: 1px solid rgba(30,143,255,0.4); color: #E8F0FF; padding: 14px 28px; border-radius: 100px; font-family: 'Exo 2', sans-serif; font-size: 16px; font-weight: 600; z-index: 9999; white-space: nowrap; box-shadow: 0 8px 30px rgba(0,0,0,0.5), 0 0 20px rgba(30,143,255,0.2);`;
      document.body.appendChild(toast);
      setTimeout(() => { toast.remove(); }, 2400);
    }

    window.addEventListener('DOMContentLoaded', () => {
      new OSCARBackground('three-canvas');

      document.getElementById('btn-back').addEventListener('click', () => {
        window.location.href = 'immersive.html';
      });

      document.getElementById('btn-traiter').addEventListener('click', () => {
        showToast('✓ Anomalie marquée comme traitée');
        setTimeout(() => {
          window.location.href = 'immersive.html';
        }, 1200);
      });

      document.getElementById('btn-notifier').addEventListener('click', () => {
        showToast('📢 Employé notifié avec succès');
      });

      document.getElementById('btn-historique').addEventListener('click', () => {
        showToast('Historique — fonctionnalité bientôt disponible');
      });
    });
  </script>
</body>
</html>
